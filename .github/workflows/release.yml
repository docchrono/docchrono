name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and release tools
        run: python -m pip install -e ".[dev]"
      - name: Verify tag and project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py "$RELEASE_TAG"
      - name: Run quality gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          pyright
          python -m pytest --cov=docchrono --cov-report=term-missing
          python -m pip_audit
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
      - name: Smoke-install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I -c "import docchrono; assert docchrono.__version__"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event.release.prerelease && 'TestPyPI' || 'PyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.release.prerelease && 'testpypi' || 'pypi' }}
      url: ${{ github.event.release.prerelease && 'https://test.pypi.org/p/docchrono' || 'https://pypi.org/p/docchrono' }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ github.event.release.prerelease && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
